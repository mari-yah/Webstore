{% extends 'base.html' %}

{% block content %}
    <div class="container">
        <h1 class="brand-title">{{ brand_name }}</h1>
        <div class="product-list">
            {% for product in products %}
                <div class="product-item">
                    <a href="{% url 'product_detail' product.product_id %}" class="product-link">
                        <img src="{{ product.image.url }}" alt="{{ product.product_name }}" class="product-image">
                        <h2 class="product-name">{{ product.product_name }}</h2>
                        <p class="product-price">₹{{ product.price }}</p>
                    </a>
                    <div class="product-actions">
                        <button class="action-button add-to-cart" onclick="toggleCart(this)">
                            <i class="fas fa-shopping-cart"></i> <span>Add to Cart</span>
                        </button>
                        <button class="action-button wishlist" onclick="toggleWishlist(this)">
                            <i class="fas fa-heart"></i> <span>Wishlist</span>
                        </button>
                    </div>
                </div>
            {% empty %}
                <p class="no-products">No products available for this brand.</p>
            {% endfor %}
        </div>
    </div>
{% endblock %}
