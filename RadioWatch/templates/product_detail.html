{% extends 'base.html' %}
{% load static %}

{% block title %}{{ product.product_name }} - Rolex Store{% endblock %}

{% block content %}
<div class="product-detail-container">
    
    <!-- Image Section -->
    <div class="product-image-container">
        <img src="{{ product.image.url }}" alt="{{ product.product_name }}" class="product-image">
    </div>
    
    <!-- Details Section -->
    <div class="product-details-container">
        <h1 class="product-name">{{ product.product_name }}</h1>
        <p class="product-description"><strong>Description:</strong> {{ product.description }}</p>
        <p class="product-price"><strong>Price:</strong> ₹{{ product.price }}</p>

        <div class="action-buttons">
            <!-- Add to Cart Form -->
            <form id="addToCartForm" action="{% url 'add_to_cart' product.product_id %}" method="post">
                {% csrf_token %}
                <button type="button" class="action-button add-to-cart" 
                        onclick="showPopupAndSubmit('Item added to cart!')">
                    <i class="fas fa-shopping-cart"></i> Add to Cart
                </button>
            </form>

            <!-- Add to Wishlist Button -->
            <button type="button" class="action-button add-to-wishlist" 
                    onclick="showPopup('Added to wishlist!')">
                <i class="fas fa-heart"></i> Add to Wishlist
            </button>
        </div>
    </div>
</div>

<!-- Popup Element -->
<div id="popup" class="popup">
    <p class="popup-message" id="popup-message"></p>
    <button onclick="closePopup()">OK</button>
</div>

<!-- Link to CSS -->
<link rel="stylesheet" href="{% static 'css/product_detail.css' %}">

<!-- Script for Popup and Form Submission -->
<script>
    function showPopup(message) {
        const popup = document.getElementById('popup');
        const popupMessage = document.getElementById('popup-message');
        
        popupMessage.textContent = message;
        popup.classList.add('active');

        // Auto close the popup after 2 seconds
        setTimeout(closePopup, 2000);
    }

    function showPopupAndSubmit(message) {
        showPopup(message);

        // Delay form submission to show the popup first
        setTimeout(function() {
            document.getElementById('addToCartForm').submit();
        }, 2000); // Wait 2 seconds before submitting
    }

    function closePopup() {
        const popup = document.getElementById('popup');
        popup.classList.remove('active');
    }
</script>
{% endblock %}
