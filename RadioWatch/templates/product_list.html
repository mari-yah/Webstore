{% extends 'base.html' %}
{% load static %}

{% block title %}Shop - Rolex Store{% endblock %}

{% block content %}
<section class="hero">
    <h1 class="hero-title">Shop</h1>
    <p class="hero-description">Explore our exclusive range of products</p>
</section>

<!-- Product Grid Section -->
<div class="main-content">
    <main class="product-grid">
        {% for product in products %}
        <div class="product-card" 
        data-id="{{ product.id|default:'0' }}" 
        data-name="{{ product.product_name|default:'Unknown' }}" 
        data-price="{{ product.price|default:'0' }}" 
        data-image="{{ product.image.url|default:'#' }}">
                <img src="{{ product.image.url }}" alt="{{ product.product_name }}">
                <h3>{{ product.product_name }}</h3>
                <p class="price">₹{{ product.price }}</p>
                <button class="add-to-cart">Add to Cart</button>
                <button class="add-to-wishlist">Wishlist</button>
            </div>
        {% endfor %}
    </main>
</div>

<script src="{% static 'js/main.js' %}"></script>
{% endblock %}
