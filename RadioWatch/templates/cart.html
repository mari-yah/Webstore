{% extends 'base.html' %}
{% load static %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{% static 'img/favicon.png' %}" type="image/x-icon">
    
    <!-- Boxicons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <title>Cart - My Watches Store</title>
</head>
<body>
    <!-- Header -->
   
        

    <!-- Cart Page Content -->
    <main class="cart-page">
        <div class="cart-container">
            <h3 class="cart-title" style="font-size: 25px; margin: 40px 0;">Your Cart</h3>


            <!-- Cart Items -->
            <div class="cart-items">
                <!-- Cart Item 1 -->
                <div class="cart-item">
                    <img src="{% static 'img/watch1.jpg' %}" alt="Watch 1" class="cart-item-img">
                    <div class="cart-item-info">
                        <h3 class="cart-item-name">Rolex Submariner</h3>
                        <p class="cart-item-price">$12,000</p>
                    </div>
                    <div class="cart-item-quantity">
                        <input type="number" value="1" min="1" class="cart-item-quantity-input">
                    </div>
                    <div class="cart-item-total">
                        <p class="cart-item-total-price">$12,000</p>
                    </div>
                    <button class="cart-item-remove">
                        <i class="bx bx-x"></i> Remove
                    </button>
                </div>

                <!-- Cart Item 2 -->
                <div class="cart-item">
                    <img src="{% static 'img/watch2.jpg' %}" alt="Watch 2" class="cart-item-img">
                    <div class="cart-item-info">
                        <h3 class="cart-item-name">Rolex Daytona</h3>
                        <p class="cart-item-price">$15,500</p>
                    </div>
                    <div class="cart-item-quantity">
                        <input type="number" value="1" min="1" class="cart-item-quantity-input">
                    </div>
                    <div class="cart-item-total">
                        <p class="cart-item-total-price">$15,500</p>
                    </div>
                    <button class="cart-item-remove">
                        <i class="bx bx-x"></i> Remove
                    </button>
                </div>
            </div>

            <!-- Cart Summary -->
            <div class="cart-summary">
                <div class="cart-summary-item">
                    <p>Subtotal:</p>
                    <p class="cart-summary-price">$27,500</p>
                </div>
                <div class="cart-summary-item">
                    <p>Shipping:</p>
                    <p class="cart-summary-price">Free</p>
                </div>
                <div class="cart-summary-item cart-summary-total">
                    <p>Total:</p>
                    <p class="cart-summary-price">$27,500</p>
                </div>
                <button class="checkout-btn">Proceed to Checkout</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer section">
        <!-- Footer content here -->
    </footer>

    <!-- JavaScript -->
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
{% endblock %}
