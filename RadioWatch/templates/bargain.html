<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bargain Price</title>
</head>
<body>
    <h2>Bargain for {{ bargain.product.product_name }}</h2>
    <p>Original Price: ₹{{ bargain.product.price }}</p>
    <p>Discount Applied: {{ discount }}%</p>
    <p>Final Bargained Price: ₹{{ bargain.final_price }}</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Accept Price</button>
    </form>
</body>
</html>
