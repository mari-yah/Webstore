{% extends 'base.html' %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/wishlist_styles.css' %}?v=2">

{% block content %}
    <main class="wishlist-page">
        <div class="wishlist-container">
            <h3 class="wishlist-title">Your Wishlist</h3>
            <div class="wishlist-items"></div>
            <p class="wishlist-empty" style="display: none;">Your wishlist is empty. <a href="/">Browse products</a> to add items!</p>
        </div>
    </main>

    <script src="{% static 'js/main.js' %}"></script>
{% endblock %}
